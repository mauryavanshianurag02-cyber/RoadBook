<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1d4ed8" />
<title>StockBook — Inventory &amp; Warehouse Management</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4ed8'/%3E%3Cpath d='M12 22l20-8 20 8-20 8z' fill='%23fff'/%3E%3Cpath d='M12 22v20l20 8V30z' fill='%23bfdbfe'/%3E%3Cpath d='M52 22v20L32 50V30z' fill='%2393c5fd'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="app">

  <!-- ============ SIDEBAR / DRAWER ============ -->
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="30" height="30"><rect width="64" height="64" rx="14" fill="#1d4ed8"/><path d="M12 22l20-8 20 8-20 8z" fill="#fff"/><path d="M12 22v20l20 8V30z" fill="#bfdbfe"/><path d="M52 22v20L32 50V30z" fill="#93c5fd"/></svg>
      </span>
      <span class="brand-text"><strong>StockBook</strong><small>Inventory &amp; Warehouse</small></span>
      <button class="icon-btn only-mobile" id="btnCloseNav" aria-label="Close menu">✕</button>
    </div>

    <nav class="nav" id="mainNav">
      <button class="nav-item is-active" data-view="dashboard">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-view="inventory">
        <svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>
        <span>Inventory</span>
        <i class="nav-count" id="countProducts" hidden></i>
      </button>
      <button class="nav-item" data-view="inbound">
        <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>
        <span>Inbound</span>
      </button>
      <button class="nav-item" data-view="outbound">
        <svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 20h16"/></svg>
        <span>Outbound</span>
      </button>
      <button class="nav-item" data-view="history">
        <svg viewBox="0 0 24 24"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>
        <span>Transactions / History</span>
      </button>
      <button class="nav-item nav-add" data-action="add-product">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span>Add Product</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="db-status" id="dbStatus"><span class="dot"></span><span id="dbStatusText">Connecting…</span></div>
      <p class="stored-note">Warehouses: AKASHARWDI · TABLE 1 · CHAIR</p>
    </div>
  </aside>
  <div class="nav-backdrop" id="navBackdrop" hidden></div>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btnMenu" aria-label="Open menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="topbar-head">
        <h1 class="view-title" id="viewTitle">Dashboard</h1>
        <p class="view-sub" id="viewSub">All warehouses</p>
      </div>
      <div class="topbar-actions">
        <div class="wh-switch" id="whSwitch" role="group" aria-label="Warehouse filter"></div>
        <button class="btn primary" id="btnAddProduct">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <span>Add Product</span>
        </button>
      </div>
    </header>

    <div class="offline" id="offlineBanner" hidden></div>

    <main class="content" id="content">
      <section class="view" id="view-dashboard"></section>
      <section class="view" id="view-inventory" hidden></section>
      <section class="view" id="view-inbound" hidden></section>
      <section class="view" id="view-outbound" hidden></section>
      <section class="view" id="view-history" hidden></section>
    </main>
  </div>

  <!-- ============ BOTTOM TABS (mobile) ============ -->
  <nav class="tabbar" id="tabbar" aria-label="Quick navigation">
    <button class="tab is-active" data-view="dashboard">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-view="inventory">
      <svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>
      <span>Inventory</span>
    </button>
    <button class="tab tab-add" data-action="add-product" aria-label="Add product">
      <span class="tab-add-btn">+</span>
    </button>
    <button class="tab" data-view="inbound">
      <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>
      <span>Inbound</span>
    </button>
    <button class="tab" data-view="outbound">
      <svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 20h16"/></svg>
      <span>Outbound</span>
    </button>
  </nav>
</div>

<!-- ============ MODAL ============ -->
<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">Add</h2>
      <button class="icon-btn" id="modalClose" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- ============ CONFIRM ============ -->
<div class="modal-backdrop" id="confirmBackdrop" hidden>
  <div class="modal modal-sm" role="alertdialog" aria-modal="true">
    <h2 id="confirmTitle">Are you sure?</h2>
    <p id="confirmText"></p>
    <div class="modal-actions">
      <button class="btn ghost" id="confirmNo">Cancel</button>
      <button class="btn danger" id="confirmYes">Yes, continue</button>
    </div>
  </div>
</div>

<!-- ============ IMAGE PREVIEW ============ -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" id="lightboxClose" aria-label="Close image">✕</button>
  <img id="lightboxImg" alt="Product image preview" />
  <p class="lightbox-cap" id="lightboxCap"></p>
</div>

<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

<script src="js/core.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
